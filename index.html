<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>血色圣果 · 绯红圣所 | Bloodyberry</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #040208;
        color: #f3e4c3;
        font-family: "Cinzel", "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #140819 0%, #07030c 60%, #030106 100%);
      }
      canvas {
        display: block;
        touch-action: none;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
